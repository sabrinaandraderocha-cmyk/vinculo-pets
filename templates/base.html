<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Vínculo{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page">
  <div class="page-bg">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="{{ url_for('index') }}">
          <span class="brand-mark" aria-hidden="true">🐾</span>
          <span class="brand-name">Vínculo</span>
        </a>

        <nav class="top-actions">
          {% if session.get("user_id") %}
            <a class="btn ghost" href="{{ url_for('logout') }}">Sair</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="toast-stack">
            {% for category, msg in messages %}
              <div class="toast {{ category }}">{{ msg }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span class="muted">Vínculo • seu diário pet com carinho</span>
      </div>
    </footer>
  </div>
</body>
</html>
