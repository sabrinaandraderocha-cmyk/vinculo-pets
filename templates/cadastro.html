<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Pet - Vínculo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5">
</head>
<body>
<div class="container">
    <nav class="top-nav">
        <a href="/" class="logo-text">⬅ Voltar</a>
        <span style="font-weight:bold; color:#888;">Novo Pet</span>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="auth-container" style="max-width: 100%; text-align: left;">
        <h2 style="text-align: center; margin-bottom: 25px;">Quem é o novo membro? 🐶🐱</h2>

        <form method="post">
            <div class="form-group">
                <label class="form-label">Nome do Pet</label>
                <input type="text" name="nome" placeholder="Ex: Thor, Luna..." required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label">Espécie</label>
                    <select name="especie">
                        <option value="Cão">Cão 🐶</option>
                        <option value="Gato">Gato 🐱</option>
                        <option value="Outro">Outro 🐹</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Nascimento (aprox)</label>
                    <input type="text" name="nascimento" placeholder="Ex: 10/2023">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Observações / Personalidade</label>
                <textarea name="obs" placeholder="Ex: Ama dormir no sofá, tem medo de chuva..."></textarea>
            </div>

            <hr style="border:0; border-top: 1px dashed #ddd; margin: 25px 0;">
            <h3 style="font-size: 1.1rem; margin-bottom: 15px;">👨‍👩‍👧‍👦 Responsáveis</h3>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 15px;">
                <select name="resp1_tipo">
                    <option value="Tutor">Tutor</option>
                    <option value="Mãe">Mamãe</option>
                    <option value="Pai">Papai</option>
                </select>
                <input type="text" name="resp1_nome" placeholder="Nome (Ex: Sabrina)">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
                <select name="resp2_tipo">
                    <option value="Tutor">Tutor</option>
                    <option value="Pai">Papai</option>
                    <option value="Mãe">Mamãe</option>
                </select>
                <input type="text" name="resp2_nome" placeholder="Nome do parceiro(a)">
            </div>

            <hr style="border:0; border-top: 1px dashed #ddd; margin: 25px 0;">
            <h3 style="font-size: 1.1rem; margin-bottom: 15px;">🍗 Preferências</h3>

            <div class="form-group">
                <label class="form-label">Música Preferida</label>
                <input type="text" name="musica_preferida" placeholder="Ex: MPB, Piano clássico...">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label" style="color: var(--secondary);">Comidas Preferidas</label>
                    <textarea name="alimentos_preferidos" placeholder="Sachê, frango..." style="height: 100px;"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" style="color: #c0392b;">🚫 PROIBIDOS (Alergias)</label>
                    <textarea name="alimentos_proibidos" placeholder="Chocolate, uva..." style="height: 100px; border-color: #fadbd8; background: #fff5f5;"></textarea>
                </div>
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 20px;">Salvar Cadastro ✨</button>
        </form>
    </div>
</div>
</body>
</html>
