{% extends "base.html" %}

{% block content %}

<div class="container narrow">
    
    <div class="card">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="color: var(--brand); font-weight: 800; margin-bottom: 5px;">
                {% if edit_mode %}Editar Perfil ✏️{% else %}Quem é o novo membro? 🐾{% endif %}
            </h2>
            <p class="muted">Preencha com carinho as informações.</p>
        </div>

        <form method="POST">
            
            <h4 style="color: var(--accent); border-bottom: 2px dashed #f0ebf8; padding-bottom: 10px; margin-bottom: 20px;">
                🆔 Identidade
            </h4>

            <div class="input-group">
                <label>Nome do Pet</label>
                <input type="text" name="nome" class="input-modern" value="{{ pet.nome if pet else '' }}" required placeholder="Ex: Thor, Luna...">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="input-group">
                    <label>Espécie</label>
                    <select name="especie" class="input-modern">
                        <option value="cão" {% if pet and 'cão' in pet.especie|lower %}selected{% endif %}>Cão 🐶</option>
                        <option value="gato" {% if pet and 'gato' in pet.especie|lower %}selected{% endif %}>Gato 🐱</option>
                        <option value="ave" {% if pet and 'ave' in pet.especie|lower %}selected{% endif %}>Ave 🐦</option>
                        <option value="outro" {% if pet and 'outro' in pet.especie|lower %}selected{% endif %}>Outro 🐾</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Nascimento (aprox)</label>
                    <input type="text" name="nascimento" class="input-modern" value="{{ pet.nascimento if pet else '' }}" placeholder="Ex: 10/2023">
                </div>
            </div>

            <h4 style="color: var(--accent); border-bottom: 2px dashed #f0ebf8; padding-bottom: 10px; margin-top: 30px; margin-bottom: 20px;">
                📖 Histórias & Detalhes
            </h4>

            <div class="input-group">
                <label>Por que escolheu esse nome?</label>
                <input type="text" name="motivo_nome" class="input-modern" value="{{ pet.motivo_nome if pet else '' }}" placeholder="Ex: Homenagem, cara de quem apronta...">
            </div>

            <div class="input-group">
                <label>Ele(a) quase se chamou...</label>
                <input type="text" name="quase_chamou" class="input-modern" value="{{ pet.quase_chamou if pet else '' }}" placeholder="Ex: Rex, Godzila, Fifi...">
            </div>

            <div class="input-group">
                <label>Como nos conhecemos (O Encontro)</label>
                <textarea name="como_conhecemos" class="input-modern" rows="3" placeholder="Conte essa história...">{{ pet.como_conhecemos if pet else '' }}</textarea>
            </div>
            
            <div class="input-group">
                <label>Atividade preferida (Hobby)</label>
                <input type="text" name="atividade_preferida" class="input-modern" value="{{ pet.atividade_preferida if pet else '' }}" placeholder="Ex: Dormir, latir pro nada...">
            </div>

            <div class="input-group">
                <label>Observações Gerais</label>
                <textarea name="obs" class="input-modern" rows="2">{{ pet.obs if pet else '' }}</textarea>
            </div>

            <h4 style="color: var(--accent); border-bottom: 2px dashed #f0ebf8; padding-bottom: 10px; margin-top: 30px; margin-bottom: 20px;">
                👥 Quem cuida?
            </h4>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 15px;">
                <select name="resp1_tipo" class="input-modern">
                    <option value="Tutor" {% if pet and pet.resp1_tipo == 'Tutor' %}selected{% endif %}>Tutor(a)</option>
                    <option value="Mãe" {% if pet and pet.resp1_tipo == 'Mãe' %}selected{% endif %}>Mãe de Pet</option>
                    <option value="Pai" {% if pet and pet.resp1_tipo == 'Pai' %}selected{% endif %}>Pai de Pet</option>
                </select>
                <input type="text" name="resp1_nome" class="input-modern" value="{{ pet.resp1_nome if pet else '' }}" placeholder="Nome do principal">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
                <select name="resp2_tipo" class="input-modern">
                    <option value="Tutor" {% if pet and pet.resp2_tipo == 'Tutor' %}selected{% endif %}>Tutor(a)</option>
                    <option value="Mãe" {% if pet and pet.resp2_tipo == 'Mãe' %}selected{% endif %}>Mãe de Pet</option>
                    <option value="Pai" {% if pet and pet.resp2_tipo == 'Pai' %}selected{% endif %}>Pai de Pet</option>
                </select>
                <input type="text" name="resp2_nome" class="input-modern" value="{{ pet.resp2_nome if pet else '' }}" placeholder="Nome (opcional)">
            </div>

            <h4 style="color: var(--accent); border-bottom: 2px dashed #f0ebf8; padding-bottom: 10px; margin-top: 30px; margin-bottom: 20px;">
                🍗 Preferências
            </h4>

            <div class="input-group">
                <label>Música Preferida</label>
                <input type="text" name="musica_preferida" class="input-modern" value="{{ pet.musica_preferida if pet else '' }}" placeholder="Ex: MPB, Rock, Latidos Lo-Fi...">
            </div>

            <div class="input-group">
                <label>Alimentos Preferidos</label>
                <textarea name="alimentos_preferidos" class="input-modern" rows="2">{{ pet.alimentos_preferidos if pet else '' }}</textarea>
            </div>


            <div style="margin-top: 40px; display: flex; gap: 15px; padding-top: 20px; border-top: 1px solid #e2d9f3;">
                <a href="{{ url_for('index') }}" class="btn outline" style="flex: 1;">Cancelar</a>
                <button type="submit" class="btn full" style="flex: 2;">
                    Salvar Perfil
                </button>
            </div>

        </form>
    </div>
</div>

{% endblock %}
