{% extends "base.html" %}
{% block title %}Login • Vínculo{% endblock %}

{% block content %}
<section class="card auth">
  <h1>Bem-vinda de volta</h1>
  <p class="muted">Entre para acompanhar seus pets com organização e afeto.</p>

  <form method="post" class="form">
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="seu@email.com">
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
    </div>

    <button class="btn primary full" type="submit">Entrar</button>
  </form>

  <div class="auth-footer">
    <span class="muted">Não tem conta?</span>
    <a class="link" href="{{ url_for('signup') }}">Cadastrar</a>
  </div>
</section>
{% endblock %}
