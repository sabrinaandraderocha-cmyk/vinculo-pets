{% extends "base.html" %}

{% block content %}

<div class="auth-wrapper">
    <div class="auth-card">
        
        <div style="margin-bottom: 25px; text-align: center;">
            <span style="font-family: 'Segoe UI', Roboto, sans-serif; font-size: 38px; font-weight: 800; color: var(--accent); letter-spacing: -1.5px;">
                Vínculo
            </span>
        </div>
        
        <h2 style="font-size: 22px; margin-bottom: 10px; color: var(--text); font-weight: 700;">
            Bem-vinda de volta! 👋
        </h2>
        <p style="color: var(--muted); margin-top: 0; margin-bottom: 30px; font-size: 15px;">
            Entre para cuidar de quem você ama.
        </p>

        <form method="POST">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" class="input-modern" placeholder="ex: ana@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" class="input-modern" placeholder="Sua senha secreta" required>
            </div>

            <button type="submit" class="btn full" style="margin-top: 10px;">
                Entrar no Diário
            </button>
        </form>

        <div class="switch-auth">
            Ainda não tem conta? 
            <a href="{{ url_for('signup') }}" class="link" style="color: var(--accent);">Criar agora</a>
        </div>

    </div>
</div>

{% endblock %}
