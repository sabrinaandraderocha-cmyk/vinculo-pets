{% extends "base.html" %}
{% set narrow = true %}

{% block content %}
<div class="card auth">

  <h2>Bem-vinda de volta</h2>
  <p class="muted">
    Entre para acompanhar seus pets com carinho 🐾
  </p>

  <form method="post" autocomplete="off">

    <div class="field">
      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        placeholder="seu@email.com"
        autocomplete="email"
      >
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        placeholder="••••••••"
        autocomplete="current-password"
      >
    </div>

    <button type="submit" class="btn primary full">
      Entrar
    </button>

  </form>

  <div class="auth-footer">
    <span class="muted">Não tem conta?</span>
    <a href="{{ url_for('signup') }}" class="link">Criar conta</a>
  </div>

</div>
{% endblock %}
