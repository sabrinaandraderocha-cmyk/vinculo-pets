<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Vínculo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>
<body>

    <div class="container">
        <div class="auth-box">
            <h1 class="brand-title">🐾 Criar Conta</h1>
            <p class="subtitle">Organize o amor pelo seu pet.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="post">
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-group" style="margin-top: 30px; border-top: 1px dashed #dfe6e9; padding-top: 20px;">
                    <label class="form-label" style="color: var(--pink);">💌 Código de Convite (Opcional)</label>
                    <input type="text" name="invite_code" class="invite-code-input" placeholder="EX: A1B2C3">
                </div>

                <button type="submit" class="btn-primary">Criar Conta</button>
            </form>

            <div class="mt-20">
                <span class="muted">Já tem conta?</span> 
                <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Fazer Login</a>
            </div>
        </div>
    </div>

</body>
</html>
