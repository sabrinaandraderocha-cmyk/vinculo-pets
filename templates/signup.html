<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Vínculo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=13">
</head>
<body>

    <div class="container">
        <div style="text-align: center; margin-bottom: 20px;">
            <h1 class="brand-title">🐾 Vínculo</h1>
            <p style="color: #666;">Comece a organizar o amor.</p>
        </div>

        <div class="auth-box">
            <h2 class="page-title" style="text-align: center;">Criar Conta</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('signup') }}" method="post">
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" placeholder="Uma senha forte" required>
                </div>

                <div class="form-group" style="margin-top: 25px; border-top: 1px dashed #ddd; padding-top: 15px;">
                    <label class="form-label" style="color: #d35400;">💌 Tem código de convite? (Opcional)</label>
                    <input type="text" name="invite_code" class="invite-code-input" placeholder="EX: A1B2C3">
                </div>

                <button type="submit" class="btn-primary btn-block">Criar Conta</button>
            </form>

            <div class="auth-footer">
                Já tem conta? <a href="{{ url_for('login') }}" class="link-highlight">Fazer Login →</a>
            </div>
        </div>
    </div>

</body>
</html>
