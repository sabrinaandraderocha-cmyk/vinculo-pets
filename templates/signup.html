{% extends "base.html" %}

{% block content %}

<div class="auth-wrapper">
    <div class="auth-card">
        
        <div style="margin-bottom: 20px; text-align: center;">
            <span style="font-family: 'Segoe UI', Roboto, sans-serif; font-size: 40px; font-weight: 800; color: var(--accent); letter-spacing: -1px;">
                Vínculo
            </span>
        </div>

        <h2 style="font-size: 20px; margin-bottom: 10px; color: var(--text); font-weight: 700;">
            Crie sua conta 💜
        </h2>
        <p style="color: var(--muted); margin-top: 0; margin-bottom: 30px; font-size: 15px;">
            Comece um novo diário ou entre em uma família.
        </p>

        <form method="POST">
            
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" class="input-modern" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" class="input-modern" placeholder="Crie uma senha segura" required>
            </div>

            <div style="background: #fbfaff; padding: 15px; border-radius: 16px; border: 1px dashed #e2d9f3; margin-bottom: 25px; text-align: left;">
                <label for="invite_code" style="color: var(--brand); font-weight: 700; font-size: 14px; margin-bottom: 5px; display: block;">
                    Tem um código de convite? (Opcional)
                </label>
                
                <input type="text" name="invite_code" id="invite_code" class="input-modern" placeholder="Ex: ABC123" style="text-transform: uppercase; letter-spacing: 2px; text-align: center; font-weight: bold;">
                
                <p style="font-size: 12px; color: var(--muted); margin: 8px 0 0 0; line-height: 1.4;">
                    Deixe em branco para <strong>criar uma nova família</strong> do zero.
                </p>
            </div>

            <button type="submit" class="btn full" style="height: 50px; font-size: 16px;">
                Começar agora
            </button>
        </form>

        <div class="switch-auth">
            Já tem cadastro? 
            <a href="{{ url_for('login') }}" class="link">Fazer login</a>
        </div>

    </div>
</div>

{% endblock %}
